<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Шаг — түр хаалттай</title>
<meta name="description" content="Шаг шатахуун хүргэлтийн сайт түр хаалттай байна.">
<meta name="theme-color" content="#0A0F14">
<link rel="icon" href="a/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--asphalt:#0A0F14;--frost:#EAF0F4;--fog:#93A2AF;--sodium:#FFB02E;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--asphalt);color:var(--frost);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{position:relative;min-height:100%;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-1;background:#0c141b url(a/hero.jpg) center/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,15,.55) 0%,rgba(7,11,15,.35) 35%,rgba(10,15,20,.92) 78%,var(--asphalt) 100%)}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(56px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:10px;font-family:Oswald,sans-serif;font-weight:700;font-size:26px;letter-spacing:.04em;margin-bottom:28vh}
.brand svg{width:28px;height:28px}
h1{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(48px,9vw,120px);line-height:.95;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{font-size:clamp(16px,1.6vw,19px);line-height:1.55;color:#D3DCE2;max-width:46ch;margin:20px 0 0}
.tag{display:inline-block;margin-top:28px;font-weight:700;font-size:13px;color:var(--sodium);border:1px solid rgba(255,176,46,.4);border-radius:999px;padding:8px 14px}
</style>
</head>
<body>
<main>
  <div class="bg" aria-hidden="true"></div>
  <div class="wrap">
    <div class="brand"><svg viewBox="0 0 24 24" fill="#FFB02E" aria-hidden="true"><path d="M12 2c-3.9 0-7 3.1-7 7 0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>ШАГ</div>
    <h1>Сайт түр хаалттай байна</h1>
    <p>Шаг шатахуун хүргэлтийн үйлчилгээ түр зогссон байна. Удахгүй дахин нээгдэнэ. Хүлээцтэй хандсанд баярлалаа.</p>
    <span class="tag">shagiinbenzin.mn</span>
  </div>
</main>
</body>
</html>
